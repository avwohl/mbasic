[build-system]
# 77.0 is the first release that accepts a PEP 639 SPDX `license` string and
# `license-files` (see [project] below). This is a build-time requirement only;
# the built wheel is pure Python and still installs on any requires-python.
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mbasic"
dynamic = ["version"]
description = "MBASIC2025 5.21 BASIC language - Independent open-source implementation"
readme = "README.md"
requires-python = ">=3.8"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    {name = "Aaron Wohl", email = "mbasic@wohl.com"}
]
keywords = [
    "basic",
    "interpreter",
    "vintage",
    "retro",
    "programming",
    "mbasic",
    "mbasic-5.21",
    "basic-80",
    "cp/m",
    "vintage-computing"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Software Development :: Compilers",
    "Topic :: System :: Emulators",
    "Environment :: Console",
    "Environment :: Console :: Curses",
]

# Core MBASIC has ZERO dependencies - pure Python stdlib
dependencies = []

[project.optional-dependencies]
# Curses UI backend (full-screen terminal interface)
curses = ["urwid>=2.0.0"]

# Tkinter UI backend (graphical interface)
# Note: tkinter is included with Python, but on some Linux systems
# requires python3-tk package: sudo apt-get install python3-tk
tk = []

# Web UI backend (browser-based, NiceGUI)
web = ["nicegui>=3.2.0"]

# All UI backends plus the in-UI help browser
all = [
    "urwid>=2.0.0",
    "nicegui>=3.2.0",
    "python-frontmatter>=1.0.0",
]

# Development dependencies
dev = [
    "pytest>=7.0",
    "pexpect>=4.8.0",
    "build>=0.10.0",
    "twine>=4.0.0",
]

# Help system (for frontmatter parsing in help files)
help = ["python-frontmatter>=1.0.0"]

# Documentation generation
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "mkdocs-awesome-pages-plugin>=2.9.0"
]

# Full development environment
full = [
    "urwid>=2.0.0",
    "nicegui>=3.2.0",
    "pytest>=7.0",
    "pexpect>=4.8.0",
    "python-frontmatter>=1.0.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "mkdocs-awesome-pages-plugin>=2.9.0"
]

[project.urls]
Homepage = "https://github.com/avwohl/mbasic"
Documentation = "https://avwohl.github.io/mbasic/"
Repository = "https://github.com/avwohl/mbasic"
Issues = "https://github.com/avwohl/mbasic/issues"
# The GitHub releases page, not docs/dev/WORK_IN_PROGRESS.md: that file is
# deliberately deleted when work completes, so the PyPI Changelog link 404'd.
Changelog = "https://github.com/avwohl/mbasic/releases"

[project.scripts]
mbasic = "src.mbasic_main:main"

[tool.setuptools]
# The `mbasic` console script lives in src/mbasic_main.py (the extensionless
# ./mbasic file at the repo root is only a launcher for source checkouts and is
# deliberately NOT packaged - setuptools cannot ship an extensionless module).
packages = [
    "src", "src.ui", "src.ui.web", "src.editing", "src.filesystem", "src.iohandler",
    "src.docs",     # docs/   -> in-UI help browser content
    "src.runtime",  # runtime/ -> C support library used by --compile-c
]

[tool.setuptools.dynamic]
version = {attr = "src.version.VERSION"}

# Tell setuptools not to look for __init__.py in src (flat namespace)
# This allows imports like: from runtime import Runtime
[tool.setuptools.package-dir]
"" = "."  # Root is current directory
# Ship docs/ inside the installed package so the in-UI help browser works after
# `pip install` (src/resource_locator.py looks for <src>/docs/help/index.md).
"src.docs" = "docs"
"src.runtime" = "runtime"

[tool.setuptools.package-data]
# Keybinding definitions loaded at import time by src/ui/keybindings.py
"src.ui" = ["*.json"]
# Editor assets served by the web backend
"src.ui.web" = ["*.js", "*.css"]
# In-UI help browser content and the bundled example/library programs
"src.docs" = [
    "help/**/*.md",
    "help/**/*.json",
    "library/**/*.md",
    "library/**/*.bas",
    "library/**/*.BAS",
]
# C sources linked by --compile-c
"src.runtime" = ["strings/*.c", "strings/*.h"]
